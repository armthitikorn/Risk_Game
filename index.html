<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เกมวางแผนชีวิต</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--fg:#101c2e;--card:#fff;--mut:#5b677a;--bd:#d7dde6;--ac:#1b3a5c;--acf:#fff;--gain:#1e9e72;--loss:#d6453d;--pro:#5b6ee1;--inv:#b9801a;--mov:#7a8799;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1522;--fg:#e8edf4;--card:#142234;--mut:#93a0b4;--bd:#243349;--ac:#6fa3db;--acf:#0c1522;--pro:#8b9bff;--inv:#e0a63c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1522;--fg:#e8edf4;--card:#142234;--mut:#93a0b4;--bd:#243349;--ac:#6fa3db;--acf:#0c1522;--pro:#8b9bff;--inv:#e0a63c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;line-height:1.45;font-variant-numeric:tabular-nums}
#app{max-width:1180px;margin:0 auto;padding:14px}
h1{font-size:1.55rem;font-weight:700;letter-spacing:-.01em;margin:.1em 0}
h2{font-size:1.3rem;font-weight:600;margin:.2em 0}h3{font-size:1.1rem;font-weight:600;margin:.2em 0}
button{font:inherit;border:0;border-radius:10px;padding:12px 18px;background:var(--ac);color:var(--acf);font-weight:600;cursor:pointer;margin:4px 6px 4px 0;transition:transform .08s}
button:active{transform:scale(.97)}
button.g{background:transparent;color:var(--fg);border:1px solid var(--bd)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);width:100%;margin:8px 0}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:14px;margin:8px 0}
.lv0{border-color:var(--gain)}.lv1{border-color:#d9a400}.lv2{border-color:#ef7d00}
.lv3{border-color:var(--loss);animation:pl 1.1s infinite}
.out{opacity:.5;filter:grayscale(1)}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 #d6453d66}50%{box-shadow:0 0 18px 3px #d6453dcc}}
.big{font-size:2.1rem;font-weight:700;letter-spacing:-.02em}
.mut{color:var(--mut);font-size:1rem}
.lg{font-size:1.05em;margin:4px 0}
.mk{color:#fff;border-radius:8px;padding:6px 10px;font-weight:600;margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row b{font-size:1.15rem}
.chip{display:inline-block;border:1px solid var(--bd);border-radius:6px;padding:2px 9px;margin:2px 4px 2px 0;font-size:1rem;background:var(--bg)}
.wrap{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:900px){.wrap{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:5px;aspect-ratio:1;width:100%;padding:10px;background:var(--card);border:1.5px solid var(--bd);border-radius:20px}
.t{border-radius:8px;background:color-mix(in srgb,var(--c) 10%,var(--card));border:1px solid color-mix(in srgb,var(--c) 28%,var(--bd));color:var(--mut);font-size:clamp(.55rem,1.55vw,.88rem);font-weight:500;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden;position:relative;min-width:0}
.t svg{width:clamp(14px,3.4vw,26px);height:clamp(14px,3.4vw,26px);color:var(--c)}
.t.start{--c:var(--ac)}.t.luck{--c:var(--gain)}.t.bad,.t.accident,.t.illness{--c:var(--loss)}.t.skip,.t.back{--c:var(--mov)}.t.invest{--c:var(--inv)}.t.insure{--c:var(--pro)}
.pw{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;pointer-events:none}
.pw span{width:1.75em;height:1.75em;margin:-3px;border-radius:50%;color:#fff;border:2px solid var(--card);font-size:clamp(.7rem,2.5vw,1.1rem);font-weight:700;display:grid;place-items:center;line-height:1;box-shadow:0 2px 6px #0007}
.pw span.me{box-shadow:0 0 0 3px #ffd60a,0 2px 6px #0007}
.pw span.mv{animation:hop .26s}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-40%) scale(1.2)}100%{transform:translateY(0)}}
.mid{grid-area:2/2/8/8;display:flex;flex-direction:column;justify-content:center;padding:10px 12px;font-size:clamp(.7rem,1.9vw,1.15rem);overflow:hidden}
.board .mid{border:1px dashed var(--bd);border-radius:14px;background:transparent}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div id="err" style="display:none;background:#d62f2f;color:#fff;padding:8px 12px;font-size:.9rem"></div><div id="app">กำลังเชื่อมต่อ…</div>
<script>
const T=['start','luck','invest','bad','insure','illness','skip','luck','accident','invest','back','luck','insure','bad','illness','invest','luck','skip','accident','insure','back','luck','bad','invest','illness','insure','accident','luck'];
const M={start:['🏁','เงินเดือน'],luck:['🍀','รายได้พิเศษ'],bad:['⚡','รายจ่ายฉุกเฉิน'],skip:['⏸️','พักฟื้น'],back:['↩️','ภาระหนี้'],invest:['📈','ลงทุน'],insure:['🛡️','ประกัน'],accident:['🚑','อุบัติเหตุ'],illness:['🏥','เจ็บป่วย']};
const INS={life:'ชีวิต',hl:'สุขภาพ',acc:'อุบัติเหตุ'},PR={life:3000,hl:2500,acc:1500},CV={life:15000,hl:20000,acc:10000};
const MKT={bull:{lo:[.72,1200,-800],hi:[.48,6000,-4000]},flat:{lo:[.58,750,-700],hi:[.32,3000,-4000]},bear:{lo:[.35,750,-1200],hi:[.18,3000,-5000]}};
const MKN={bull:['▲','ตลาดขาขึ้น · โอกาสเติบโต','#1e9e72'],flat:['▬','ตลาดทรงตัว · ผลตอบแทนผันผวน','#6e7a8a'],bear:['▼','ตลาดขาลง · ความเสี่ยงขาดทุนสูง','#d6453d']};
const mkt=()=>(G.mk&&G.mk[(G.round||1)-1])||'flat';
const mbanner=()=>{const n=MKN[mkt()];return `<div class="mk" style="background:${n[2]}">${n[0]} ${n[1]}</div>`};
const odds=k=>{const w=MKT[mkt()][k],p=Math.round(w[0]*100);return `${p}% +${f(w[1])} / ${100-p}% -${f(-w[2])}`};
const COL=['#e5484d','#3e63dd','#30a46c','#e08a00','#8e4ec6','#12a594','#d6409f','#6e7a8a','#a2623a','#0091ff'];
const POS=T.map((_,i)=>i<8?[0,i]:i<14?[i-7,7]:i<22?[7,7-(i-14)]:[7-(i-21),0]);
const SB_URL='https://wzwyotzzxycqfwercakh.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6d3lvdHp6eHljcWZ3ZXJjYWtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTcwNTg3MTMsImV4cCI6MjA3MjYzNDcxM30.lgiAf9oBUqsaWGb3u_80wuoKAODQHE_lIBxpGumhrno';
const Q=new URLSearchParams(location.search);const room=(Q.get('room')||'').toUpperCase();
function mkDb(room){const sb=supabase.createClient(SB_URL,SB_KEY),C={},subs=[];
 const note=()=>subs.forEach(s=>s());let lw=0,sig='';
 const chk=r=>{if(r&&r.error)showErr('บันทึกไม่ได้: '+r.error.message)};
 const pull=async()=>{if(Date.now()-lw<1500)return;const{data,error}=await sb.from('game_rows').select('path,data').eq('room',room).order('path');
  if(error){showErr('อ่านข้อมูลไม่ได้: '+error.message);return}
  const g=JSON.stringify(data||[]);if(g==sig)return;sig=g;
  Object.keys(C).forEach(k=>delete C[k]);(data||[]).forEach(r=>C[r.path]=r.data);note()};
 let live=0,tk=0;setInterval(()=>{if(!live||++tk%8==0)pull()},2000);
 const rows=pre=>Object.keys(C).filter(k=>k.startsWith(pre)).map(k=>({id:k.slice(pre.length),data:()=>C[k]}));
 sb.channel('r'+room).on('postgres_changes',{event:'*',schema:'public',table:'game_rows',filter:'room=eq.'+room},e=>{
  if(e.eventType=='DELETE')delete C[e.old.path];else C[e.new.path]=e.new.data;note()})
 .subscribe(st=>{live=st=='SUBSCRIBED';if(live)pull()});pull();
 return{doc:path=>({
  set:async d=>{C[path]=d;note();lw=Date.now();chk(await sb.from('game_rows').upsert({room,path,data:d}))},
  update:async d=>{C[path]={...(C[path]||{}),...d};note();lw=Date.now();chk(await sb.rpc('merge_row',{p_room:room,p_path:path,p_patch:d}))},
  delete:async()=>{delete C[path];note();lw=Date.now();chk(await sb.from('game_rows').delete().eq('room',room).eq('path',path))},
  onSnapshot(cb){const f=()=>cb({id:path.split('/')[1],exists:path in C,data:()=>C[path]});subs.push(f);f();return()=>{}}}),
 collection:name=>({onSnapshot(cb){const f=()=>cb({docs:rows(name+'/')});subs.push(f);f();return()=>{}}})}}
function showErr(m){const e=document.getElementById('err');e.textContent='⚠️ '+m;e.style.display='block'}
const qr=()=>{const u=location.origin+location.pathname+'?room='+room+'&role=player';return `<div class="card"><div class="row"><img width="110" height="110" alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(u)}"><div class="mut">สแกนเพื่อเข้าห้อง <b>${room}</b><br>${esc(u)}</div></div></div>`};
function newRoom(){const c=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[rnd(24)]).join('');location.search='?room='+c+'&role=host'}
function goRoom(){const c=document.getElementById('rc').value.trim().toUpperCase();if(c)location.search='?room='+c+'&role=player'}
const $=document.getElementById('app');
const f=n=>Number(n).toLocaleString('en-US'),rnd=n=>Math.floor(Math.random()*n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,uid,role=Q.get('role'),P={},G={phase:'lobby'},busy=false,choice=null,arm=false;
const ids=()=>Object.keys(P).sort((a,b)=>P[a].n-P[b].n);
const col=id=>COL[ids().indexOf(id)%10];
const lv=p=>{const h=p.ins.includes('hl');return p.cash<2000?3:(p.cash<6000&&!h)?2:(p.cash<5000||!h)?1:0};
const score=p=>p.cash+1000*p.ins.length;
const part=()=>G.order&&G.phase!='lobby'?ids().filter(i=>G.order.includes(i)):ids();
const rank=()=>part().sort((a,b)=>(P[b].st=='ok')-(P[a].st=='ok')||score(P[b])-score(P[a]));
const chips=p=>p.ins.map(k=>`<span class="chip">🛡️${INS[k]} ${f((p.cov||{})[k]||0)}</span>`).join('')||'<span class="chip">ไม่มีประกัน</span>';
const ST={ok:'',dead:'💀 เสียชีวิต',broke:'💸 ล้มละลาย'};
const isTurn=()=>G.phase=='play'&&G.order&&G.order[G.turn]==uid;
const pick=p=>({pos:p.pos,cash:p.cash,ins:p.ins,st:p.st,skip:p.skip,cov:p.cov,lap:p.lap||0});

function eff(p,t){let m='',v;
 if(t=='luck'){v=[500,1000,1500,2500][rnd(4)];p.cash+=v;m='ได้รับรายได้พิเศษ/โบนัส +'+f(v)}
 else if(t=='bad'){v=[800,1500,2500,4000][rnd(4)];p.cash-=v;m='รายจ่ายฉุกเฉิน/ซ่อมรถ/ของใช้จำเป็น -'+f(v)}
 else if(t=='skip'){p.skip=1;m='พัก 1 ตา · หยุดตัดสินใจทางการเงินชั่วคราว'}
 else if(t=='back'){p.pos=(p.pos+25)%28;m='ภาระหนี้/ค่าใช้จ่ายก้อนใหญ่ ทำให้แผนสะดุด (ถอย 3 ช่อง)'}
 else if(t=='accident'||t=='illness'){const ill=t=='illness',k=ill?'hl':'acc';v=ill?[3500,5000,8000,12000][rnd(4)]:[1500,3000,5000,8000][rnd(4)];let pay=0;
  if(p.ins.includes(k)){pay=Math.min(v,p.cov[k]||0);p.cov[k]=(p.cov[k]||0)-pay;if(p.cov[k]<=0)p.ins=p.ins.filter(x=>x!=k)}
  const o=v-pay;m=(ill?'เจ็บป่วย ':'อุบัติเหตุ ')+'ค่ารักษา '+f(v)+(pay?' ประกันจ่าย '+f(pay):'')+' จ่ายเอง '+f(o);
  if(ill&&p.cash<o){if(p.ins.includes('life')){p.ins=p.ins.filter(x=>x!='life');p.cash=CV.life;return 'เสียชีวิต! ประกันชีวิตจ่ายทุน '+f(CV.life)+' กลับมาเริ่มใหม่'}
   p.st='dead';return 'ไม่มีเงินค่ารักษา เสียชีวิต 💀'}
  p.cash-=o}
 if(p.cash<0&&p.st=='ok'){p.st='broke';m+=' ล้มละลาย 💸'}
 return m}

async function fin(patch,msg){busy=true;render();
 P[uid]={...P[uid],...patch};
 await db.doc('players/'+uid).update(patch);
 const o=G.order;let t=G.turn,r=G.round,phase='play';
 const alive=o.filter(i=>P[i]&&P[i].st=='ok');
 do{t++;if(t>=o.length){t=0;r++}}while(alive.length&&!(P[o[t]]&&P[o[t]].st=='ok'));
 if(!alive.length||r>G.max||(G.n0>3&&alive.length<=3))phase='end';
 await db.doc('game/main').update({turn:t,round:r,phase,log:[msg,...(G.log||[])].slice(0,8)});
 choice=null;busy=false;render()}

async function roll(){if(busy)return;busy=true;render();
 const p={...P[uid],ins:[...P[uid].ins],cov:{...(P[uid].cov||{})}},d=1+rnd(6);
 let m=p.name+' ทอยได้ '+d;
 if(p.pos+d>=28){p.lap=(p.lap||0)+1;const b=2000+500*p.lap;p.cash+=b;m+=' ผ่านรอบที่ '+p.lap+' โบนัส +'+f(b)}
 p.pos=(p.pos+d)%28;const t=T[p.pos];m+=' → '+M[t][1]+' ';
 if(t=='invest'||t=='insure'){P[uid]=p;await db.doc('players/'+uid).update({pos:p.pos,cash:p.cash});choice={t,m};busy=false;render();return}
 m+=eff(p,t);await fin(pick(p),m)}
async function skipT(){const p=P[uid];await fin({skip:p.skip-1},p.name+' พักตานี้')}
async function inv(k){const p={...P[uid],ins:[...P[uid].ins],cov:{...(P[uid].cov||{})}};let m=p.name+' ผ่านช่องลงทุน';
 if(k!='no'){const hi=k=='hi',mk=mkt(),w=MKT[mk][k],win=Math.random()<w[0],v=win?w[1]:w[2];p.cash+=v;
  m=p.name+' ลงทุน'+(hi?'เสี่ยงสูง ':'เสี่ยงต่ำ ')+MKN[mk][0]+' '+(v>0?'กำไร +':'ขาดทุน ')+f(v);
  if(p.cash<0){p.st='broke';m+=' ล้มละลาย 💸'}}
 await fin(pick(p),m)}
async function buy(k){const p={...P[uid],ins:[...P[uid].ins],cov:{...(P[uid].cov||{})}};let m=p.name+' ไม่ซื้อประกัน';
 if(k!='no'){p.cash-=PR[k];p.ins.push(k);p.cov[k]=CV[k];m=p.name+' ซื้อประกัน'+INS[k]}
 await fin(pick(p),m)}
async function haunt(){const p=P[uid],al=part().filter(i=>P[i].st=='ok');if(!al.length||p.ghost<1)return;
 const t=al[rnd(al.length)],q=P[t],c=q.cash-1000,u={cash:c};if(c<0)u.st='broke';
 await db.doc('players/'+t).update(u);await db.doc('players/'+uid).update({ghost:p.ghost-1});
 await db.doc('game/main').update({log:[`👻 ${p.name} ปล่อยข่าวร้ายใส่ ${q.name} -1,000`,...(G.log||[])].slice(0,8)})}
async function join(){if(G.phase!='lobby'){render();return}const n=document.getElementById('nm').value.trim().slice(0,12);if(!n)return;
 await db.doc('players/'+uid).set({name:n,pos:0,cash:10000,ins:[],st:'ok',skip:0,ghost:3,cov:{},lap:0,n:Date.now()})}
async function start(){const o=ids().filter(i=>P[i].st=='ok').sort(()=>Math.random()-.5);if(o.length<2)return;
 await db.doc('game/main').set({phase:'play',order:o,turn:0,round:1,max:20,n0:o.length,log:['เริ่มเกม!'],mk:Array.from({length:21},()=>['bull','flat','bear'][rnd(3)])})}
async function reset(){if(!arm){arm=true;render();return}arm=false;
 for(const i of ids())await db.doc('players/'+i).delete();await db.doc('game/main').set({phase:'lobby'})}
function setRole(r){role=r;render()}

const podium=()=>`<div class="card"><h2>🏆 จบเกม</h2>${rank().slice(0,3).map((id,i)=>`<div class="big">${'🥇🥈🥉'.slice(i*2,i*2+2)} ${esc(P[id].name)} <span class="mut">฿${f(score(P[id]))}</span></div>`).join('')}</div>`;
const hl=t=>{let h=esc(t);const I=ids();I.forEach((id,i)=>{const n=esc(P[id].name);if(n)h=h.split(n).join('\u0001'+i+'\u0002')});
 return h.replace(/\u0001(\d+)\u0002/g,(_,i)=>`<b style="color:${col(I[i])}">${esc(P[I[i]].name)}</b>`)};
const logs=n=>(G.log||[]).slice(0,n).map(l=>`<div class="lg">• ${hl(l)}</div>`).join('');

const IP={start:'M5 21V4M5 4h11l-2 4 2 4H5',luck:'M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5l-5.4 3 1.2-6L3.3 9.3l6.1-.7z',bad:'M13 2L4 14h7l-1 8 9-12h-7z',skip:'M8 5v14M16 5v14',back:'M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3',invest:'M3 17l6-6 4 4 8-8M15 7h6v6',insure:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',accident:'M12 3l10 18H2zM12 10v5M12 18v.01',illness:'M9 4h6v5h5v6h-5v5H9v-5H4V9h5z'};
const IC=Object.fromEntries(Object.entries(IP).map(([k,d])=>[k,`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`]));
const AV=['🐱','🐶','🐰','🦊','🐼','🐯','🐸','🐵','🦄','🐧'];
const av=id=>esc(((P[id]||{}).name||'?').slice(0,1).toUpperCase());
let disp={},stp={};
function sync(){ids().forEach(id=>{const p=P[id];if(disp[id]==null){disp[id]=p.pos;return}if(disp[id]!=p.pos&&!stp[id]){stp[id]=1;step(id)}})}
function step(id){const p=P[id];if(!p){stp[id]=0;return}const c=disp[id],t=p.pos;
 if(c==t){stp[id]=0;render();return}
 const fw=(t-c+28)%28;disp[id]=fw<=6?(c+1)%28:(c+27)%28;render();setTimeout(()=>step(id),260)}
function cellsHtml(){return T.map((t,i)=>{const[r,c]=POS[i];
 const pw=part().filter(id=>disp[id]==i&&P[id].st=='ok').map(id=>`<span class="${id==uid?'me':''} ${stp[id]?'mv':''}" style="background:${col(id)}">${av(id)}</span>`).join('');
 return `<div class="t ${t}" style="grid-row:${r+1};grid-column:${c+1}">${IC[t]}<span>${M[t][1]}</span><div class="pw">${pw}</div></div>`}).join('')}
const mini=()=>{const cur=G.phase=='play'&&G.order?P[G.order[G.turn]]:null;return `<div class="mid">${cur?`<b style="color:${col(G.order[G.turn])}">▶ ${esc(cur.name)}</b>`:''}${G.phase=='play'?mbanner():''}${logs(2)}</div>`};
let FC='',FN=3,AR={},asb;
async function adLoad(){const{data,error}=await asb.from('game_rows').select('room,path,data').gte('updated_at',new Date(Date.now()-864e5).toISOString());
 if(error){showErr(error.message);return}
 AR={};data.forEach(r=>{const o=AR[r.room]=AR[r.room]||{P:{}};if(r.path=='game/main')o.G=r.data;else o.P[r.path.slice(8)]=r.data});adDraw()}
async function sendFinal(){const c=FC.toUpperCase().replace(/[^A-Z0-9]/g,''),n=Math.max(1,Math.min(10,+FN||3));if(!c)return;
 for(const k of Object.keys(AR))if(AR[k].G&&AR[k].G.phase=='end')await asb.rpc('merge_row',{p_room:k,p_path:'game/main',p_patch:{final:c,adv:n}});adLoad()}
function adDraw(){if(document.activeElement&&document.activeElement.tagName=='INPUT')return;
 const sc=p=>p.cash+1000*p.ins.length,TH={lobby:'รอเริ่ม',play:'กำลังเล่น',end:'จบแล้ว'};
 const rk=r=>{const o=r.G&&r.G.order&&r.G.phase!='lobby'?r.G.order:Object.keys(r.P);return o.filter(i=>r.P[i]).sort((a,b)=>(r.P[b].st=='ok')-(r.P[a].st=='ok')||sc(r.P[b])-sc(r.P[a]))};
 const ks=Object.keys(AR).filter(k=>AR[k].G||Object.keys(AR[k].P).length).sort();
 const n=ks.reduce((a,k)=>a+Object.keys(AR[k].P).length,0),e=ks.filter(k=>AR[k].G&&AR[k].G.phase=='end').length;
 $.innerHTML=`<h1>📊 ผู้ดูแลทุกห้อง</h1><div class="mut">${ks.length} ห้อง · ${n} คน · จบแล้ว ${e} ห้อง</div>
 <div class="card"><b>🏆 ส่งผู้ชนะเข้ารอบชิง</b><input placeholder="รหัสห้องรอบชิง (ตั้งเอง เช่น FINAL)" value="${esc(FC)}" oninput="FC=this.value"><input type="number" min="1" max="10" value="${FN}" oninput="FN=this.value"><div class="mut">จำนวนผู้ชนะต่อห้อง · ส่งให้เฉพาะห้องที่จบแล้ว</div><button onclick="sendFinal()">ส่งผู้ชนะไปรอบชิง</button></div>
 <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px">${ks.map(k=>{const r=AR[k],g=r.G||{},end=g.phase=='end';
  return `<div class="card"><div class="row"><b>ห้อง ${esc(k)}</b><span class="mut">${TH[g.phase||'lobby']} · ${Object.keys(r.P).length} คน${g.phase=='play'?' · ตา '+g.round:''}</span></div>${rk(r).slice(0,Math.max(3,g.adv||0)).map((id,i)=>{const p=r.P[id];return `<div class="lg">${i<3?'🥇🥈🥉'.slice(i*2,i*2+2):(i+1)+'.'} ${esc(p.name)} ฿${f(sc(p))} ${p.st!='ok'?ST[p.st]:''} ${end&&i<(g.adv||+FN||3)&&p.st=='ok'?'✅':''}</div>`}).join('')}</div>`}).join('')||'<div class="card mut">ยังไม่มีห้อง</div>'}</div>`}
function admin(){asb=supabase.createClient(SB_URL,SB_KEY);adLoad();setInterval(adLoad,3000)}
const finalBtn=()=>{if(!G.final)return'';const i=rank().indexOf(uid);
 if(i<0||i>=(G.adv||3)||P[uid].st!='ok')return '<div class="card">ขอบคุณที่ร่วมเล่น 🎉</div>';
 return `<div class="card lv0"><h3>🏆 คุณผ่านเข้ารอบชิง!</h3><button style="width:100%;font-size:1.2rem" onclick="location.search='?room=${G.final}&role=player&name='+encodeURIComponent(P[uid].name)">ไปห้องชิงชนะเลิศ</button></div>`};
function host(){
 const cells=cellsHtml();
 const cur=G.phase=='play'?P[G.order[G.turn]]:null;
 const mid=`<div class="mid card"><h2>ตาที่ ${G.round||0}/${G.max||20}</h2>${G.phase=='play'?mbanner():''}${cur?`<div class="big" style="color:${col(G.order[G.turn])}">▶ ${esc(cur.name)}</div>`:`<div class="mut">${G.phase=='end'?'จบเกม':'รอผู้เล่น…'}</div>`}${logs(5)}</div>`;
 const list=part().map(id=>{const p=P[id],o=p.st!='ok';
  return `<div class="card ${o?'out':'lv'+lv(p)}"><div class="row"><b style="color:${col(id)}">● ${esc(p.name)} ${cur&&G.order[G.turn]==id?'▶':''}</b><span>฿${f(p.cash)}</span></div><div>${o?ST[p.st]+' (ผี 👻)':chips(p)}</div></div>`}).join('');
 return `<div class="row"><div><h1>เกมวางแผนชีวิต</h1><div class="mut">ห้อง <b>${room}</b></div></div><div>${G.phase!='play'&&G.phase!='end'?`<button onclick="start()" ${ids().length<2?'disabled':''}>เริ่มเกม (${ids().length} คน)</button>`:''}<button class="g" onclick="reset()">${arm?'กดอีกครั้งเพื่อยืนยัน':'รีเซ็ต'}</button></div></div>
 ${G.phase=='end'?podium():''}
 <div class="wrap"><div class="board">${cells}${mid}</div><div>${G.phase=='lobby'?qr():''}${list}<div class="mut">สถานะการเงิน: 🟢 เงินสำรองเพียงพอ 🟡 เริ่มตึงตัว 🟠 เสี่ยงขาดสภาพคล่อง 🔴 วิกฤตการเงิน</div></div></div>`}

function play(){const p=P[uid];
 if(p&&G.phase!='lobby'&&G.order&&!G.order.includes(uid))return '<div class="card"><h3>เกมเริ่มไปแล้ว</h3><div class="mut">คุณเข้าห้องไม่ทัน รอเล่นรอบหน้านะ</div></div>';
 if(!p)return `<h2>เข้าร่วมเกม</h2>${G.phase=='lobby'?`<input id="nm" placeholder="ชื่อของคุณ" maxlength="12" value="${esc(Q.get('name')||'')}"><button onclick="join()">เข้าห้อง</button>`:'<div class="card">เกมเริ่มไปแล้ว รอรอบหน้านะ</div>'}`;
 const out=p.st!='ok',tl=T[p.pos];
 let act='';
 if(G.phase=='end')act=podium()+finalBtn();
 else if(out)act=`<div class="card"><h3>${ST[p.st]}</h3><div class="mut">คุณเป็นผีแล้ว ป่วนผู้เล่นที่ยังอยู่ได้ ${p.ghost} ครั้ง</div><button onclick="haunt()" ${p.ghost<1||busy?'disabled':''}>👻 ปล่อยข่าวร้าย (-1,000)</button></div>`;
 else if(G.phase=='lobby')act='<div class="card">รอผู้ควบคุมเริ่มเกม…</div>';
 else if(isTurn()){
  if(choice&&choice.t=='invest')act=`<div class="card"><h3>📈 โอกาสลงทุน (ใช้เงิน 3,000 บาท)</h3>${mbanner()}<div class="mut">ความเสี่ยงต่ำ: ${odds('lo')}<br>ความเสี่ยงสูง: ${odds('hi')}<br>ผลตอบแทนไม่แน่นอน และอาจขาดทุนได้</div><button onclick="inv('lo')" ${p.cash<3000?'disabled':''}>เสี่ยงต่ำ</button><button onclick="inv('hi')" ${p.cash<3000?'disabled':''}>เสี่ยงสูง</button><button class="g" onclick="inv('no')">ข้าม</button></div>`;
  else if(choice)act=`<div class="card"><h3>🛡️ วางแผนรับมือความเสี่ยง</h3><div class="mut">จ่ายเบี้ยเพื่อรับความคุ้มครองตามวงเงินที่กำหนด · ควรเลือกให้เหมาะกับเงินสดที่มี</div>${Object.keys(PR).filter(k=>!p.ins.includes(k)).map(k=>`<button onclick="buy('${k}')" ${p.cash<PR[k]?'disabled':''}>${INS[k]} ฿${f(PR[k])}<br><small>คุ้มครอง ${f(CV[k])}</small></button>`).join('')}<button class="g" onclick="buy('no')">ไม่ซื้อ</button></div>`;
  else if(p.skip>0)act=`<div class="card"><h3>⏸️ ติดพัก</h3><button onclick="skipT()" ${busy?'disabled':''}>ข้ามตานี้</button></div>`;
  else act=`<div class="card"><h2>ตาของคุณ!</h2><button style="font-size:1.4rem;width:100%;padding:20px" onclick="roll()" ${busy?'disabled':''}>${busy?'🎲 กำลังทอย…':'🎲 ทอยลูกเต๋า'}</button></div>`}
 else act=`<div class="card mut">รอ <b style="color:${col(G.order[G.turn])}">${esc((P[G.order[G.turn]]||{}).name||'')}</b> เล่น…</div>`;
 return `<div class="board">${cellsHtml()}${mini()}</div><div class="card ${out?'out':'lv'+lv(p)}"><div class="row"><h2 style="color:${col(uid)}">${esc(p.name)}</h2><span class="mut">ช่อง ${M[tl][0]} ${M[tl][1]} · รอบ ${p.lap||0}</span></div><div class="big">฿${f(p.cash)}</div><div class="mut">เงินสดคงเหลือ (บาท)</div>${out?ST[p.st]:chips(p)}</div>${act}<div>${logs(3)}</div>`}

function render(){if(P)sync();if(document.activeElement&&document.activeElement.tagName=='INPUT')return;
 if(!room){$.innerHTML='<h1>เกมวางแผนชีวิต</h1><button style="width:100%;padding:24px" onclick="newRoom()">🖥️ สร้างห้อง (ผู้ควบคุม)</button><div class="card"><input id="rc" placeholder="รหัสห้อง 4 ตัวอักษร" maxlength="6"><button onclick="goRoom()">📱 เข้าห้อง (ผู้เล่น)</button></div><button class="g" style="width:100%" onclick="location.search=&quot;?admin=1&quot;">📊 ผู้ดูแลทุกห้อง</button>';return}
 if(!db){$.innerHTML='<div class="card">กำลังเชื่อมต่อ…</div>';return}
 $.innerHTML=role==null?`<h1>เกมวางแผนชีวิต</h1><button style="width:100%;padding:24px" onclick="setRole('player')">📱 ผู้เล่น (มือถือ)</button><button class="g" style="width:100%;padding:24px" onclick="setRole('host')">🖥️ ผู้ควบคุม (คอม)</button>`:role=='host'?host():play()}

(function(){if(Q.get('admin')){admin();return}if(!room){render();return}
 try{uid=localStorage.getItem('uid')}catch(e){}
 if(!uid){uid=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2));try{localStorage.setItem('uid',uid)}catch(e){}}
 db=mkDb(room);
 db.collection('players').onSnapshot(s=>{P={};s.docs.forEach(d=>P[d.id]=d.data());render()});
 db.doc('game/main').onSnapshot(s=>{G=s.exists?s.data():{phase:'lobby'};render()});
 render()})();
</script></body></html>
