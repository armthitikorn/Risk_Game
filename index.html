<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เกมวางแผนชีวิต</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f6f4ef;--fg:#1d1d1b;--card:#fff;--mut:#6b6a66;--bd:#ddd9cf;--ac:#2f6fed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--fg:#f1efe9;--card:#24262b;--mut:#a3a199;--bd:#3a3d44;--ac:#6c9bff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181b;--fg:#f1efe9;--card:#24262b;--mut:#a3a199;--bd:#3a3d44;--ac:#6c9bff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans Thai",system-ui,sans-serif;line-height:1.4}
#app{max-width:1100px;margin:0 auto;padding:12px}
h1,h2,h3{margin:.2em 0}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer;margin:4px 4px 4px 0}
button.g{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
button:disabled{opacity:.5}
input{font:inherit;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);width:100%;margin:8px 0}
.card{background:var(--card);border:3px solid var(--bd);border-radius:16px;padding:12px;margin:8px 0}
.lv0{border-color:#2e9e5b}.lv1{border-color:#e0b400}.lv2{border-color:#ef7d00}
.lv3{border-color:#d62f2f;animation:pl 1s infinite}
.out{opacity:.55;border-color:var(--bd);filter:grayscale(1)}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 #d62f2f88}50%{box-shadow:0 0 16px 4px #d62f2f}}
.big{font-size:2rem;font-weight:800}
.mut{color:var(--mut);font-size:1rem}
.lg{font-size:1.05em;margin:3px 0;font-weight:500}
.mk{color:#fff;border-radius:10px;padding:6px 10px;font-weight:700;margin:6px 0}
.row b{font-size:1.15rem}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;margin:2px;font-size:1rem}
.wrap{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:900px){.wrap{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:3px;aspect-ratio:1;width:100%}
.t{border-radius:8px;background:var(--card);border:1px solid var(--bd);font-size:clamp(.55rem,1.6vw,.9rem);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative;min-width:0}
.t i{font-style:normal;font-size:clamp(.9rem,2.4vw,1.4rem)}
.t.luck{background:#2e9e5b22}.t.bad,.t.accident,.t.illness{background:#d62f2f1f}.t.skip,.t.back{background:#ef7d0022}.t.invest{background:#2f6fed22}.t.insure{background:#8e44ad22}.t.start{background:#e0b40033}
.pw{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;pointer-events:none}
.pw span{width:1.7em;height:1.7em;margin:-2px;border-radius:50%;background:var(--card);border:2.5px solid;font-size:clamp(.8rem,3vw,1.3rem);display:grid;place-items:center;line-height:1}
.pw span.me{box-shadow:0 0 0 3px #ffd60a}
.pw span.mv{animation:hop .26s}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-40%) scale(1.2)}100%{transform:translateY(0)}}
.mid{grid-area:2/2/8/8;display:flex;flex-direction:column;justify-content:center;padding:8px;font-size:clamp(.7rem,1.9vw,1.15rem);overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
</style></head>
<body><div id="err" style="display:none;background:#d62f2f;color:#fff;padding:8px 12px;font-size:.9rem"></div><div id="app">กำลังเชื่อมต่อ…</div>
<script>
const T=['start','luck','invest','bad','insure','illness','skip','luck','accident','invest','back','luck','insure','bad','illness','invest','luck','skip','accident','insure','back','luck','bad','invest','illness','insure','accident','luck'];
const M={start:['🏁','เริ่ม'],luck:['🍀','โชคดี'],bad:['⚡','โชคร้าย'],skip:['⏸️','พัก'],back:['↩️','ถอย'],invest:['📈','ลงทุน'],insure:['🛡️','ประกัน'],accident:['🚑','อุบัติเหตุ'],illness:['🏥','เจ็บป่วย']};
const INS={life:'ชีวิต',hl:'สุขภาพ',acc:'อุบัติเหตุ'},PR={life:3000,hl:2500,acc:1500},CV={life:15000,hl:20000,acc:10000};
const MKT={bull:{lo:[.9,1200,-300],hi:[.7,6000,-3000]},flat:{lo:[.7,750,-300],hi:[.45,3000,-3000]},bear:{lo:[.2,750,-1000],hi:[.2,3000,-3000]}};
const MKN={bull:['📈','ตลาดกระทิง ผลตอบแทนสูง','#2e9e5b'],flat:['➡️','ตลาดทรงตัว','#7d7b73'],bear:['📉','ตลาดหมี ขาดทุนง่าย','#d62f2f']};
const mkt=()=>(G.mk&&G.mk[(G.round||1)-1])||'flat';
const mbanner=()=>{const n=MKN[mkt()];return `<div class="mk" style="background:${n[2]}">${n[0]} ${n[1]}</div>`};
const odds=k=>{const w=MKT[mkt()][k],p=Math.round(w[0]*100);return `${p}% +${f(w[1])} / ${100-p}% -${f(-w[2])}`};
const COL=['#e6453a','#2f6fed','#2e9e5b','#c47b00','#8e44ad','#00a5a8','#d6336c','#5f6b7a','#7a4a1e','#3b5bdb'];
const POS=T.map((_,i)=>i<8?[0,i]:i<14?[i-7,7]:i<22?[7,7-(i-14)]:[7-(i-21),0]);
const SB_URL='https://wzwyotzzxycqfwercakh.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6d3lvdHp6eHljcWZ3ZXJjYWtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTcwNTg3MTMsImV4cCI6MjA3MjYzNDcxM30.lgiAf9oBUqsaWGb3u_80wuoKAODQHE_lIBxpGumhrno';
const Q=new URLSearchParams(location.search);const room=(Q.get('room')||'').toUpperCase();
function mkDb(room){const sb=supabase.createClient(SB_URL,SB_KEY),C={},subs=[];
 const note=()=>subs.forEach(s=>s());let lw=0,sig='';
 const chk=r=>{if(r&&r.error)showErr('บันทึกไม่ได้: '+r.error.message)};
 const pull=async()=>{if(Date.now()-lw<1500)return;const{data,error}=await sb.from('game_rows').select('path,data').eq('room',room).order('path');
  if(error){showErr('อ่านข้อมูลไม่ได้: '+error.message);return}
  const g=JSON.stringify(data||[]);if(g==sig)return;sig=g;
  Object.keys(C).forEach(k=>delete C[k]);(data||[]).forEach(r=>C[r.path]=r.data);note()};
 setInterval(pull,2000);
 const rows=pre=>Object.keys(C).filter(k=>k.startsWith(pre)).map(k=>({id:k.slice(pre.length),data:()=>C[k]}));
 sb.channel('r'+room).on('postgres_changes',{event:'*',schema:'public',table:'game_rows',filter:'room=eq.'+room},e=>{
  if(e.eventType=='DELETE')delete C[e.old.path];else C[e.new.path]=e.new.data;note()})
 .subscribe(st=>{if(st=='SUBSCRIBED')pull()});pull();
 return{doc:path=>({
  set:async d=>{C[path]=d;note();lw=Date.now();chk(await sb.from('game_rows').upsert({room,path,data:d}))},
  update:async d=>{C[path]={...(C[path]||{}),...d};note();lw=Date.now();chk(await sb.rpc('merge_row',{p_room:room,p_path:path,p_patch:d}))},
  delete:async()=>{delete C[path];note();lw=Date.now();chk(await sb.from('game_rows').delete().eq('room',room).eq('path',path))},
  onSnapshot(cb){const f=()=>cb({id:path.split('/')[1],exists:path in C,data:()=>C[path]});subs.push(f);f();return()=>{}}}),
 collection:name=>({onSnapshot(cb){const f=()=>cb({docs:rows(name+'/')});subs.push(f);f();return()=>{}}})}}
function showErr(m){const e=document.getElementById('err');e.textContent='⚠️ '+m;e.style.display='block'}
const qr=()=>{const u=location.origin+location.pathname+'?room='+room+'&role=player';return `<div class="card"><div class="row"><img width="110" height="110" alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(u)}"><div class="mut">สแกนเพื่อเข้าห้อง <b>${room}</b><br>${esc(u)}</div></div></div>`};
function newRoom(){const c=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[rnd(24)]).join('');location.search='?room='+c+'&role=host'}
function goRoom(){const c=document.getElementById('rc').value.trim().toUpperCase();if(c)location.search='?room='+c+'&role=player'}
const $=document.getElementById('app');
const f=n=>Number(n).toLocaleString('en-US'),rnd=n=>Math.floor(Math.random()*n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,uid,role=Q.get('role'),P={},G={phase:'lobby'},busy=false,choice=null,arm=false;
const ids=()=>Object.keys(P).sort((a,b)=>P[a].n-P[b].n);
const col=id=>COL[ids().indexOf(id)%10];
const lv=p=>{const h=p.ins.includes('hl');return p.cash<2000?3:(p.cash<6000&&!h)?2:(p.cash<5000||!h)?1:0};
const score=p=>p.cash+1000*p.ins.length;
const part=()=>G.order&&G.phase!='lobby'?ids().filter(i=>G.order.includes(i)):ids();
const rank=()=>part().sort((a,b)=>(P[b].st=='ok')-(P[a].st=='ok')||score(P[b])-score(P[a]));
const chips=p=>p.ins.map(k=>`<span class="chip">🛡️${INS[k]} ${f((p.cov||{})[k]||0)}</span>`).join('')||'<span class="chip">ไม่มีประกัน</span>';
const ST={ok:'',dead:'💀 เสียชีวิต',broke:'💸 ล้มละลาย'};
const isTurn=()=>G.phase=='play'&&G.order&&G.order[G.turn]==uid;
const pick=p=>({pos:p.pos,cash:p.cash,ins:p.ins,st:p.st,skip:p.skip,cov:p.cov,lap:p.lap||0});

function eff(p,t){let m='',v;
 if(t=='luck'){v=1000*(1+rnd(3));p.cash+=v;m='+'+f(v)}
 else if(t=='bad'){v=1000*(1+rnd(3));p.cash-=v;m='-'+f(v)}
 else if(t=='skip'){p.skip=1;m='พัก 1 ตา'}
 else if(t=='back'){p.pos=(p.pos+25)%28;m='ถอยหลัง 3 ช่อง'}
 else if(t=='accident'||t=='illness'){const ill=t=='illness',k=ill?'hl':'acc';v=ill?4000+2000*rnd(4):2000+1500*rnd(4);let pay=0;
  if(p.ins.includes(k)){pay=Math.min(v,p.cov[k]||0);p.cov[k]=(p.cov[k]||0)-pay;if(p.cov[k]<=0)p.ins=p.ins.filter(x=>x!=k)}
  const o=v-pay;m=(ill?'เจ็บป่วย ':'อุบัติเหตุ ')+'ค่ารักษา '+f(v)+(pay?' ประกันจ่าย '+f(pay):'')+' จ่ายเอง '+f(o);
  if(ill&&p.cash<o){if(p.ins.includes('life')){p.ins=p.ins.filter(x=>x!='life');p.cash=CV.life;return 'เสียชีวิต! ประกันชีวิตจ่ายทุน '+f(CV.life)+' กลับมาเริ่มใหม่'}
   p.st='dead';return 'ไม่มีเงินค่ารักษา เสียชีวิต 💀'}
  p.cash-=o}
 if(p.cash<0&&p.st=='ok'){p.st='broke';m+=' ล้มละลาย 💸'}
 return m}

async function fin(patch,msg){busy=true;render();
 P[uid]={...P[uid],...patch};
 await db.doc('players/'+uid).update(patch);
 const o=G.order;let t=G.turn,r=G.round,phase='play';
 const alive=o.filter(i=>P[i]&&P[i].st=='ok');
 do{t++;if(t>=o.length){t=0;r++}}while(alive.length&&!(P[o[t]]&&P[o[t]].st=='ok'));
 if(!alive.length||r>G.max||(G.n0>3&&alive.length<=3))phase='end';
 await db.doc('game/main').update({turn:t,round:r,phase,log:[msg,...(G.log||[])].slice(0,8)});
 choice=null;busy=false;render()}

async function roll(){if(busy)return;busy=true;render();
 const p={...P[uid],ins:[...P[uid].ins],cov:{...(P[uid].cov||{})}},d=1+rnd(6);
 let m=p.name+' ทอยได้ '+d;
 if(p.pos+d>=28){p.lap=(p.lap||0)+1;const b=2000+500*p.lap;p.cash+=b;m+=' ผ่านรอบที่ '+p.lap+' โบนัส +'+f(b)}
 p.pos=(p.pos+d)%28;const t=T[p.pos];m+=' → '+M[t][1]+' ';
 if(t=='invest'||t=='insure'){P[uid]=p;await db.doc('players/'+uid).update({pos:p.pos,cash:p.cash});choice={t,m};busy=false;render();return}
 m+=eff(p,t);await fin(pick(p),m)}
async function skipT(){const p=P[uid];await fin({skip:p.skip-1},p.name+' พักตานี้')}
async function inv(k){const p={...P[uid],ins:[...P[uid].ins],cov:{...(P[uid].cov||{})}};let m=p.name+' ผ่านช่องลงทุน';
 if(k!='no'){const hi=k=='hi',mk=mkt(),w=MKT[mk][k],win=Math.random()<w[0],v=win?w[1]:w[2];p.cash+=v;
  m=p.name+' ลงทุน'+(hi?'เสี่ยงสูง ':'เสี่ยงต่ำ ')+MKN[mk][0]+' '+(v>0?'กำไร +':'ขาดทุน ')+f(v);
  if(p.cash<0){p.st='broke';m+=' ล้มละลาย 💸'}}
 await fin(pick(p),m)}
async function buy(k){const p={...P[uid],ins:[...P[uid].ins],cov:{...(P[uid].cov||{})}};let m=p.name+' ไม่ซื้อประกัน';
 if(k!='no'){p.cash-=PR[k];p.ins.push(k);p.cov[k]=CV[k];m=p.name+' ซื้อประกัน'+INS[k]}
 await fin(pick(p),m)}
async function haunt(){const p=P[uid],al=part().filter(i=>P[i].st=='ok');if(!al.length||p.ghost<1)return;
 const t=al[rnd(al.length)],q=P[t],c=q.cash-1000,u={cash:c};if(c<0)u.st='broke';
 await db.doc('players/'+t).update(u);await db.doc('players/'+uid).update({ghost:p.ghost-1});
 await db.doc('game/main').update({log:[`👻 ${p.name} ปล่อยข่าวร้ายใส่ ${q.name} -1,000`,...(G.log||[])].slice(0,8)})}
async function join(){if(G.phase!='lobby'){render();return}const n=document.getElementById('nm').value.trim().slice(0,12);if(!n)return;
 await db.doc('players/'+uid).set({name:n,pos:0,cash:10000,ins:[],st:'ok',skip:0,ghost:3,cov:{},lap:0,n:Date.now()})}
async function start(){const o=ids().filter(i=>P[i].st=='ok').sort(()=>Math.random()-.5);if(o.length<2)return;
 await db.doc('game/main').set({phase:'play',order:o,turn:0,round:1,max:20,n0:o.length,log:['เริ่มเกม!'],mk:Array.from({length:21},()=>['bull','flat','bear'][rnd(3)])})}
async function reset(){if(!arm){arm=true;render();return}arm=false;
 for(const i of ids())await db.doc('players/'+i).delete();await db.doc('game/main').set({phase:'lobby'})}
function setRole(r){role=r;render()}

const podium=()=>`<div class="card"><h2>🏆 จบเกม</h2>${rank().slice(0,3).map((id,i)=>`<div class="big">${'🥇🥈🥉'.slice(i*2,i*2+2)} ${esc(P[id].name)} <span class="mut">฿${f(score(P[id]))}</span></div>`).join('')}</div>`;
const hl=t=>{let h=esc(t);const I=ids();I.forEach((id,i)=>{const n=esc(P[id].name);if(n)h=h.split(n).join('\u0001'+i+'\u0002')});
 return h.replace(/\u0001(\d+)\u0002/g,(_,i)=>`<b style="color:${col(I[i])}">${esc(P[I[i]].name)}</b>`)};
const logs=n=>(G.log||[]).slice(0,n).map(l=>`<div class="lg">• ${hl(l)}</div>`).join('');

const AV=['🐱','🐶','🐰','🦊','🐼','🐯','🐸','🐵','🦄','🐧'];
const av=id=>AV[ids().indexOf(id)%10];
let disp={},stp={};
function sync(){ids().forEach(id=>{const p=P[id];if(disp[id]==null){disp[id]=p.pos;return}if(disp[id]!=p.pos&&!stp[id]){stp[id]=1;step(id)}})}
function step(id){const p=P[id];if(!p){stp[id]=0;return}const c=disp[id],t=p.pos;
 if(c==t){stp[id]=0;render();return}
 const fw=(t-c+28)%28;disp[id]=fw<=6?(c+1)%28:(c+27)%28;render();setTimeout(()=>step(id),260)}
function cellsHtml(){return T.map((t,i)=>{const[r,c]=POS[i];
 const pw=part().filter(id=>disp[id]==i&&P[id].st=='ok').map(id=>`<span class="${id==uid?'me':''} ${stp[id]?'mv':''}" style="border-color:${col(id)}">${av(id)}</span>`).join('');
 return `<div class="t ${t}" style="grid-row:${r+1};grid-column:${c+1}"><i>${M[t][0]}</i>${M[t][1]}<div class="pw">${pw}</div></div>`}).join('')}
const mini=()=>{const cur=G.phase=='play'&&G.order?P[G.order[G.turn]]:null;return `<div class="mid">${cur?`<b style="color:${col(G.order[G.turn])}">▶ ${esc(cur.name)} ${av(G.order[G.turn])}</b>`:''}${G.phase=='play'?mbanner():''}${logs(2)}</div>`};
function host(){
 const cells=cellsHtml();
 const cur=G.phase=='play'?P[G.order[G.turn]]:null;
 const mid=`<div class="mid card"><h2>ตาที่ ${G.round||0}/${G.max||20}</h2>${G.phase=='play'?mbanner():''}${cur?`<div class="big" style="color:${col(G.order[G.turn])}">▶ ${esc(cur.name)}</div>`:`<div class="mut">${G.phase=='end'?'จบเกม':'รอผู้เล่น…'}</div>`}${logs(5)}</div>`;
 const list=part().map(id=>{const p=P[id],o=p.st!='ok';
  return `<div class="card ${o?'out':'lv'+lv(p)}"><div class="row"><b style="color:${col(id)}">● ${esc(p.name)} ${cur&&G.order[G.turn]==id?'▶':''}</b><span>฿${f(p.cash)}</span></div><div>${o?ST[p.st]+' (ผี 👻)':chips(p)}</div></div>`}).join('');
 return `<div class="row"><div><h1>🎲 เกมวางแผนชีวิต</h1><div class="mut">ห้อง <b>${room}</b></div></div><div>${G.phase!='play'&&G.phase!='end'?`<button onclick="start()" ${ids().length<2?'disabled':''}>เริ่มเกม (${ids().length} คน)</button>`:''}<button class="g" onclick="reset()">${arm?'กดอีกครั้งเพื่อยืนยัน':'รีเซ็ต'}</button></div></div>
 ${G.phase=='end'?podium():''}
 <div class="wrap"><div class="board">${cells}${mid}</div><div>${G.phase=='lobby'?qr():''}${list}<div class="mut">🟢 ปลอดภัย 🟡 เฝ้าระวัง 🟠 อันตราย 🔴 วิกฤต</div></div></div>`}

function play(){const p=P[uid];
 if(p&&G.phase!='lobby'&&G.order&&!G.order.includes(uid))return '<div class="card"><h3>เกมเริ่มไปแล้ว</h3><div class="mut">คุณเข้าห้องไม่ทัน รอเล่นรอบหน้านะ</div></div>';
 if(!p)return `<h2>เข้าร่วมเกม</h2>${G.phase=='lobby'?`<input id="nm" placeholder="ชื่อของคุณ" maxlength="12"><button onclick="join()">เข้าห้อง</button>`:'<div class="card">เกมเริ่มไปแล้ว รอรอบหน้านะ</div>'}`;
 const out=p.st!='ok',tl=T[p.pos];
 let act='';
 if(G.phase=='end')act=podium();
 else if(out)act=`<div class="card"><h3>${ST[p.st]}</h3><div class="mut">คุณเป็นผีแล้ว ป่วนผู้เล่นที่ยังอยู่ได้ ${p.ghost} ครั้ง</div><button onclick="haunt()" ${p.ghost<1||busy?'disabled':''}>👻 ปล่อยข่าวร้าย (-1,000)</button></div>`;
 else if(G.phase=='lobby')act='<div class="card">รอผู้ควบคุมเริ่มเกม…</div>';
 else if(isTurn()){
  if(choice&&choice.t=='invest')act=`<div class="card"><h3>📈 ช่องลงทุน (3,000)</h3>${mbanner()}<div class="mut">ต่ำ: ${odds('lo')}<br>สูง: ${odds('hi')}</div><button onclick="inv('lo')" ${p.cash<3000?'disabled':''}>เสี่ยงต่ำ</button><button onclick="inv('hi')" ${p.cash<3000?'disabled':''}>เสี่ยงสูง</button><button class="g" onclick="inv('no')">ข้าม</button></div>`;
  else if(choice)act=`<div class="card"><h3>🛡️ ซื้อประกัน</h3><div class="mut">สุขภาพ/อุบัติเหตุ จ่ายค่ารักษาตามวงเงิน · ชีวิต จ่ายทุนเมื่อเสียชีวิต</div>${Object.keys(PR).filter(k=>!p.ins.includes(k)).map(k=>`<button onclick="buy('${k}')" ${p.cash<PR[k]?'disabled':''}>${INS[k]} ฿${f(PR[k])}<br><small>คุ้มครอง ${f(CV[k])}</small></button>`).join('')}<button class="g" onclick="buy('no')">ไม่ซื้อ</button></div>`;
  else if(p.skip>0)act=`<div class="card"><h3>⏸️ ติดพัก</h3><button onclick="skipT()" ${busy?'disabled':''}>ข้ามตานี้</button></div>`;
  else act=`<div class="card"><h2>ตาของคุณ!</h2><button style="font-size:1.4rem;width:100%;padding:20px" onclick="roll()" ${busy?'disabled':''}>${busy?'🎲 กำลังทอย…':'🎲 ทอยลูกเต๋า'}</button></div>`}
 else act=`<div class="card mut">รอ <b style="color:${col(G.order[G.turn])}">${esc((P[G.order[G.turn]]||{}).name||'')}</b> เล่น…</div>`;
 return `<div class="board">${cellsHtml()}${mini()}</div><div class="card ${out?'out':'lv'+lv(p)}"><div class="row"><h2 style="color:${col(uid)}">${esc(p.name)}</h2><span class="mut">ช่อง ${M[tl][0]} ${M[tl][1]} · รอบ ${p.lap||0}</span></div><div class="big">฿${f(p.cash)}</div>${out?ST[p.st]:chips(p)}</div>${act}<div>${logs(3)}</div>`}

function render(){if(P)sync();if(document.activeElement&&document.activeElement.tagName=='INPUT')return;
 if(!room){$.innerHTML='<h1>🎲 เกมวางแผนชีวิต</h1><button style="width:100%;padding:24px" onclick="newRoom()">🖥️ สร้างห้อง (ผู้ควบคุม)</button><div class="card"><input id="rc" placeholder="รหัสห้อง 4 ตัวอักษร" maxlength="6"><button onclick="goRoom()">📱 เข้าห้อง (ผู้เล่น)</button></div>';return}
 if(!db){$.innerHTML='<div class="card">กำลังเชื่อมต่อ…</div>';return}
 $.innerHTML=role==null?`<h1>🎲 เกมวางแผนชีวิต</h1><button style="width:100%;padding:24px" onclick="setRole('player')">📱 ผู้เล่น (มือถือ)</button><button class="g" style="width:100%;padding:24px" onclick="setRole('host')">🖥️ ผู้ควบคุม (คอม)</button>`:role=='host'?host():play()}

(function(){if(!room){render();return}
 try{uid=localStorage.getItem('uid')}catch(e){}
 if(!uid){uid=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2));try{localStorage.setItem('uid',uid)}catch(e){}}
 db=mkDb(room);
 db.collection('players').onSnapshot(s=>{P={};s.docs.forEach(d=>P[d.id]=d.data());render()});
 db.doc('game/main').onSnapshot(s=>{G=s.exists?s.data():{phase:'lobby'};render()});
 render()})();
</script></body></html>
